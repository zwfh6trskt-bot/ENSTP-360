<style>
:root{--blue:#0B3D91;--b2:#1F66DD;--sky:#EAF1FF;--or:#F26A1B;--orl:#FFF1E6;--ink:#0F1F3D;--mut:#5A6985;--line:#DCE4F3;--bg:#F6F8FC;--ok:#168A57;--bad:#C73E3E}
*{box-sizing:border-box}
body{margin:0;font:15px/1.55 "Plus Jakarta Sans",system-ui,sans-serif;color:var(--ink);background:var(--bg);padding-bottom:70px}
[dir=rtl] body{font-family:"IBM Plex Sans Arabic","Plus Jakarta Sans",system-ui,sans-serif}
a{color:var(--b2);text-decoration:none}h1{font-size:clamp(1.6rem,4.5vw,2.5rem);line-height:1.15;margin:.2em 0 .4em;letter-spacing:-.02em;color:var(--blue)}h2,h3{margin:.3em 0}
.wrap{max-width:1120px;margin:auto;padding:18px 16px}.narrow{max-width:760px}
#top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;padding-block:9px}.brand{display:flex;align-items:center;gap:8px;color:var(--blue)}.brand b{font-size:1.1rem}

.nav{display:none;gap:4px;margin-inline-start:10px}.nav a{padding:8px 13px;border-radius:9px;color:var(--mut);font-weight:600}.nav a.on{color:var(--blue);background:var(--sky)}
.tools{margin-inline-start:auto;display:flex;gap:8px;align-items:center}.ib{display:grid;place-items:center;width:40px;height:40px;color:var(--blue)}
select,input,textarea{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:inherit;width:100%;min-height:42px}.tools select{width:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 16px;min-height:42px;border:0;border-radius:10px;background:var(--blue);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.btn.or{background:var(--or)}.btn.gh{background:var(--sky);color:var(--blue)}.btn.bad{background:#fde8e8;color:var(--bad)}.btn.sm{min-height:36px;padding:6px 12px;font-size:.88rem}

.place{cursor:pointer;padding:16px}.lnk{all:unset;font-weight:800;font-size:1.05rem;cursor:pointer}
.filters{display:grid;gap:8px;grid-template-columns:1fr 1fr;margin-bottom:14px}.filters .btn{grid-column:1/-1}

.x{position:absolute;inset-inline-end:10px;top:6px;border:0;background:none;font-size:30px;cursor:pointer;color:var(--mut)}

.rv{border-top:1px solid var(--line);padding:10px 0}.two{display:grid;gap:18px}.log{padding-inline-start:18px;color:var(--mut)}

.tabbar{position:fixed;bottom:0;inset-inline:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}

.foot{color:var(--mut);font-size:.85rem;text-align:center;border-top:1px solid var(--line);margin-top:30px}
@media(min-width:860px){body{padding-bottom:0}.nav{display:flex}.tabbar{display:none}.hero{grid-template-columns:1.2fr .8fr}.two{grid-template-columns:1.3fr 1fr}.filters{grid-template-columns:2fr 2fr 1.4fr 1fr auto}.filters .btn{grid-column:auto}.toast{bottom:24px}}

function resForm(r={},rq){
 mform(t(r.id?'edit':'approvePub'),[{k:'title',l:t('title'),r:1},{k:'description',l:t('desc'),t:'textarea'},{k:'category',l:t('cat'),t:'select',o:CATS(),r:1},{k:'level',l:t('level'),t:'select',o:LV(),r:1},{k:'module',l:t('module')},{k:'visibility',l:t('vis'),t:'select',o:[['students',t('stud')],['public',t('public')]]},{k:'file',l:t('file'),t:'file',r:!r.id}],r,async v=>{
  const f=v.file,row={title:v.title,description:v.description||null,category:v.category,level:v.level,module:v.module||null,visibility:v.visibility,published:true};
  if(f&&f.size){row.file_path=await upload(f);row.file_name=f.name;row.mime=f.type;row.size_bytes=f.size}
  if(r.id){await ok(sb.from('resources').update(row).eq('id',r.id));if(row.file_path&&r.file_path)await sb.storage.from('resources').remove([r.file_path])}
  else{const n=await ok(sb.from('resources').insert(row).select().single());if(rq)await ok(sb.from('resource_requests').update({status:'approved',resource_id:n.id}).eq('id',rq))}})}

const S={
 gs:(f,v)=>{location.hash='#/guide?q='+encodeURIComponent(v.q)},
 dirf:async(f,v)=>{Object.assign(D,{q:v.q,loc:v.loc,sort:v.sort,max:v.max||''});await fetchPlaces(true)},
 mf:async(f,v)=>{await MF(v);shut();toast(t('saved'));route()},
 login:async(f,v)=>{await ok(sb.auth.signInWithPassword({email:v.email,password:v.password}))},
 signup:async(f,v)=>{let d;try{d=await ok(sb.auth.signUp({email:v.email,password:v.password,options:{data:{full_name:v.full_name,study_year:v.study_year}}}))}catch(e){throw Error(/database/i.test(e.message)?t('domainErr'):e.message)}if(!d.session)toast(t('checkMail'))},
 req:async(f,v)=>{await ok(sb.from('resource_requests').insert({user_id:me.id,title:v.title,description:v.description,category:v.category,level:v.level,module:v.module||null,contact:v.contact||null}));f.reset();toast(t('reqSent'))},
 rate:async(f,v)=>{const id=+f.dataset.id;await ok(sb.from('ratings').upsert({place_id:id,user_id:me.id,stars:+v.stars,comment:v.comment||null},{onConflict:'place_id,user_id'}));toast(t('saved'));await fetchPlaces(true,Math.max(12,D.rows.length));A.open(id)}};

document.addEventListener('click',go(async e=>{const el=e.target.closest('[data-a]');if(!el||!A[el.dataset.a])return;if(el.tagName!='A')e.preventDefault();await A[el.dataset.a](el.dataset.v,el)}));
document.addEventListener('submit',go(async e=>{const f=e.target.closest('[data-f]');if(!f)return;e.preventDefault();await S[f.dataset.f](f,vals(f))}));
document.addEventListener('change',go(async e=>{const el=e.target;
 if(el.id=='lg'){lang=el.value;localStorage.setItem('lang',lang);chrome();route()}
 else if(el.dataset.u){await ok(sb.from('profiles').update({[el.dataset.u]:el.type=='checkbox'?el.checked:el.value}).eq('id',el.dataset.id));toast(t('saved'))}}));
document.addEventListener('keydown',e=>{if(e.key=='Escape')shut()});

const PG={home,guide,dir,help,account,admin};
async function route(){
 const[p,q]=location.hash.slice(2).split('?'),a=p.split('/'),r=PG[a[0]]?a[0]:'home';
 document.querySelectorAll('[data-nav]').forEach(x=>x.classList.toggle('on',x.dataset.nav==r));
 app.innerHTML=spin;scrollTo(0,0);await go(PG[r])(a.slice(1),new URLSearchParams(q||''))}
async function loadProf(s){me=s?.user||null;prof=me?await ok(sb.from('profiles').select('*').eq('id',me.id).maybeSingle()):null}
(async()=>{
 chrome();window.addEventListener('hashchange',route);
 if(!sb){app.innerHTML=`<div class="wrap"><p class="note">${t('cfg')}</p></div>`;return}
 try{const{data:{session}}=await sb.auth.getSession();await loadProf(session);
  [cats,guides]=await Promise.all([ok(sb.from('place_categories').select('*').order('sort')),ok(sb.from('guides').select('*').order('sort'))]);
  sb.auth.onAuthStateChange((ev,s)=>{if(ev=='INITIAL_SESSION'||ev=='TOKEN_REFRESHED'||s?.user?.id===me?.id)return;setTimeout(async()=>{await loadProf(s);chrome();route()},0)});
  chrome();route()}catch(e){console.error(e);app.innerHTML=`<div class="wrap"><p class="note bad">${esc(e.message||t('error'))}</p></div>`}})();
</script>
